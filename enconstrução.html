<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algo Grandioso Está Chegando</title>
  <meta name="description" content="Prepare-se para o nascimento de algo extraordinário. Um novo mundo está prestes a ser revelado." />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;600&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #0a0a0a, #000);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(251,191,36,0.08), rgba(0,0,0,0.9));
      z-index: 1;
    }

    .main-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      width: 100%;
      max-width: 1200px;
      gap: 3rem;
    }

    @media (min-width: 1024px) {
      .main-container {
        flex-direction: row;
        justify-content: space-between;
        gap: 4rem;
        text-align: left;
        padding: 4rem;
      }
    }

    .content-box {
      flex: 1;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.05);
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 60px rgba(251,191,36,0.08);
      padding: 3rem 2rem;
      animation: fadeInZoom 2s ease forwards;
      max-width: 600px;
    }

    @keyframes fadeInZoom {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
  font-family: 'Cinzel', serif;
  color: #fbbf24;
  font-size: 2.2rem;
  margin-bottom: 1rem;
  text-align: center;
  width: 100%;
  line-height: 1.3;
  animation: fadeIn 1.5s ease forwards;
}

@media (min-width: 768px) {
  h1 {
    font-size: 3.2rem;
  }
}
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .typing {
      font-size: 1.1rem;
      color: #d1d5db;
      height: 2rem;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid #fbbf24;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .countdown {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0;
    }

    .countdown div {
      background: rgba(255,255,255,0.08);
      padding: 1rem;
      border-radius: 12px;
      min-width: 80px;
      text-align: center;
    }

    .countdown span {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: #2f24fb;
    }

    .battery {
      position: relative;
      width: 70px;
      height: 32px;
      margin: 30px auto;
      border: 3px solid #e2eee4;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(250, 248, 242, 0.4);
      overflow: hidden;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 8px;
      right: -10px;
      width: 8px;
      height: 14px;
      background: #44fb24;
      border-radius: 2px;
    }

    .battery-level {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f740034c, #24fb41);
      animation: charge 4s linear infinite;
      border-radius: 3px 0 0 3px;
    }

    @keyframes charge {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }

    .btn-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 20px rgba(251,191,36,0.15);
    }

    .btn span {
      position: relative;
      z-index: 10;
    }

    .animate-marble {
      animation: marble 6s ease infinite;
      opacity: 0.95;
    }

    @keyframes marble {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: #4b24fb;
      margin-top: 2rem;
      animation: float 4s ease-in-out infinite, fadeIn 2s ease forwards;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .brand {
  position: relative;
  display: inline-block;
  margin-top: 2rem;
  animation: float 4s ease-in-out infinite, fadeIn 2s ease forwards;
  font-family: 'Cinzel', serif;
  text-align: center;
}

.brand-text {
  font-size: 1.25rem;
  font-weight: 600;
  color: #4b24fb;
  text-shadow: 0 0 8px rgba(75,36,251,0.5);
  position: relative;
  z-index: 2;
}

/* 🌟 Linha brilhante apenas sob o texto */
.brand-effect {
  position: absolute;
  bottom: -6px;
  left: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00ffa6, #4b24fb, transparent);
  border-radius: 2px;
  width: 100%;
  animation: shineLine 3s ease-in-out infinite;
  mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
}

@keyframes shineLine {
  0% {
    transform: scaleX(0.6) translateX(-40%);
    opacity: 0;
  }
  50% {
    transform: scaleX(1) translateX(0%);
    opacity: 1;
  }
  100% {
    transform: scaleX(0.6) translateX(40%);
    opacity: 0;
  }
}



    footer {
      margin-top: 1.5rem;
      color: #9ca3af;
      font-size: 0.85rem;
    }

    /* === Texto digitado responsivo === */
.typing-text {
  font-family: 'Poppins', sans-serif;
  color: #fbbf24;
  text-align: center;
  white-space: normal;
  word-wrap: break-word;
  margin-top: 1.5rem;
  font-weight: 500;
  line-height: 1.4;
  animation: fadeIn 2s ease forwards;
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  padding: 0 1rem;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

.typing-text::after {
  content: '|';
  animation: blink 0.8s infinite;
  color: #fbbf24;
}


  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="overlay"></div>

  <div class="main-container">

    <!-- ESQUERDA -->
    <div class="content-box">
      <img src="https://cdn-icons-png.flaticon.com/512/1688/1688400.png" alt="Logo" class="w-20 mx-auto mb-6 animate-bounce">
      <h1>Essa página está em construção</h1>
      <!-- ✅ Texto digitado responsivo -->
  <div id="typing" class="typing-text"></div>

      <div class="battery">
        <div class="battery-level"></div>
      </div>

      <div class="countdown">
        <div><span id="days">00</span>Dias</div>
        <div><span id="hours">00</span>Horas</div>
        <div><span id="minutes">00</span>Min</div>
        <div><span id="seconds">00</span>Seg</div>
      </div>

      <div class="btn-group">
        <a href="index.html" class="btn" style="background: linear-gradient(120deg,#0d1b4c,#1a3fa0,#0d1b4c,#fbbf24); background-size:300% 300%;" >
          <span>🏠 Página Inicial</span>
        </a>

        <a href="https://wa.me/5562985558320" target="_blank" class="btn" style="background: linear-gradient(120deg,#064e3b,#059669,#064e3b,#fbbf24); background-size:300% 300%;">
          <span>💬 Fale Conosco</span>
        </a>
      </div>

      <div class="brand">
  <span class="brand-text">Moob Manutenção e Construção</span>
  <span class="brand-effect"></span>
</div>


      <footer>© <span id="ano"></span> | Todos os direitos reservados.</footer>
    </div>

    <!-- DIREITA -->
    <div class="hidden lg:flex justify-center items-center relative w-full lg:w-1/2">
      <div class="absolute w-96 h-96 rounded-full bg-gradient-to-r from-yellow-400/40 to-transparent blur-3xl animate-pulse"></div>
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Logo Moob"
           class="relative w-72 drop-shadow-[0_0_30px_#fbbf24] hover:scale-105 transition-transform duration-700 ease-in-out">
    </div>

  </div>

  <audio id="bgm" loop autoplay volume="0.2">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d3c8f4cdb7.mp3?filename=ambient-futuristic-background-music-100997.mp3" type="audio/mpeg">
  </audio>

  <script>
  const messages = [
    "Estamos aprimorando nosso site...",
    "Tudo para oferecer mais qualidade e agilidade no seu atendimento...",
    "Em breve, uma nova experiência estará no ar."
  ];
  let i = 0, j = 0;
  const speed = 80;
  const typingDiv = document.getElementById("typing");

  function type() {
    if (i < messages.length) {
      if (j < messages[i].length) {
        typingDiv.textContent += messages[i].charAt(j);
        j++;
        setTimeout(type, speed);
      } else {
        setTimeout(() => {
          typingDiv.textContent = "";
          j = 0;
          i++;
          type();
        }, 2200);
      }
    } else {
      i = 0;
      type();
    }
  }
  type();

  const launchDate = new Date("2025-12-15T00:00:00").getTime();
  setInterval(() => {
    const now = new Date().getTime();
    const distance = launchDate - now;
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
  }, 1000);

  document.getElementById("ano").textContent = new Date().getFullYear();

  // Estrelas animadas
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      z: Math.random() * canvas.width
    });
  }

  function animateStars() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < stars.length; i++) {
      const star = stars[i];
      star.z -= 0.8;
      if (star.z <= 0) star.z = canvas.width;
      const k = 128.0 / star.z;
      const px = star.x * k + canvas.width / 2;
      const py = star.y * k + canvas.height / 2;
      if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
        const size = (1 - star.z / canvas.width) * 2;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(251,191,36," + (1 - star.z / canvas.width) + ")";
        ctx.fill();
      }
    }
    requestAnimationFrame(animateStars);
  }
  animateStars();
  </script>
</body>
</html>
